- title: Selected Projects
  type: time_table
  contents:
    - title: <a href="https://github.com/FarzanehTatari/hybrid-sac-mpc-lateral-control">Hybrid MPC + Learned Control Architecture</a>
      year: 2025 – 2026
      description: Independent project combining model predictive control with a Soft Actor-Critic policy for safe vehicle lateral control. Demonstrates safe composition of a learned policy with MPC while retaining hard actuator constraints. Python/PyTorch with pytest-based unit tests. Preprint: <a href="https://arxiv.org/abs/2608.17258">arXiv:2608.17258</a>.

    - title: <a href="https://github.com/FarzanehTatari/motor-thermal-deeplearning">Data-driven Thermal Management for Electric Powertrains</a>
      year: 2024 – 2026
      description: Deep learning models for thermal estimation in electrically excited and rare-earth-free synchronous motors, supporting virtual sensing and predictive energy management. Published at IEEE ITEC (2024) and NDIA GVSETS (2026). Open-source reference implementation on the public Paderborn PMSM dataset.

    - title: Distributed Adaptive Control of Networked Systems
      year: 2016 – 2020
      description: Distributed optimal adaptive control of networked systems using reinforcement learning and game theory; finite-time identification methods for estimating subsystem coupling.

    - title: Online Stochastic Learning for Vehicle & Robot Dynamics
      year: 2021 – 2025
      description: Online stochastic learning algorithms with formal finite-time convergence guarantees for vehicle and robot dynamics models, suitable for real-time control under noise and uncertainty.

