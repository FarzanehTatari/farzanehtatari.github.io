- title: Summary
  type: list
  contents:
    - Senior Control & AI Engineer with 10+ years of experience designing and validating real-time embedded control systems for automotive powertrains and complex electromechanical systems. Three years of production experience with electrified powertrain controls spanning MIL/SIL/HIL through vehicle-level integration, now applied to software architecture in electrified propulsion. Strong foundation in model predictive control, state estimation, and data-driven CAE modeling for energy and thermal management, with a Ph.D. in control and an IEEE publication record in learning-based control and system identification.

- title: Experience
  type: time_table
  contents:
    - title: Software Architecture Engineer
      institution: Stellantis, Auburn Hills, MI
      year: Aug 2026 – Present
      description:
        - Software architecture for electrified propulsion systems.

    - title: Senior Control & AI Engineer
      institution: Drive System Design, Farmington Hills, MI
      year: Apr 2023 – Aug 2026
      description:
        - Designed, implemented, and validated embedded control systems for electrified powertrains across MIL, SIL, HIL, and vehicle-level testing.
        - Developed data-driven CAE models using supervised machine learning and deep learning for thermal estimation in electrically excited and rare-earth-free synchronous motors, enabling reduced sensor count and improved energy management in production powertrain controllers.
        - Technical lead of a team of 8 engineers across the US and North Africa, automating systems engineering analysis of diagnostic default-action disclosure reports for production embedded software.
        - Managed a team of 4 engineers across the US and UK developing embedded control and diagnostic software for production powertrain controllers.
        - Designed automation pipelines in MATLAB/Simulink that reduced controls software analysis and report-generation time.
        - Partnered with OEM and supplier customers on production-ready embedded controls software, diagnostics, and validation deliverables.
        - Collaborated on Design Failure Mode and Effects Analysis (DFMEA) for powertrain control systems in support of safety-related design analyses.

    - title: Research Assistant (Ph.D.)
      institution: Michigan State University, East Lansing, MI
      year: Aug 2021 – May 2023
      description:
        - Conducted NSF- and ONR-funded research on stochastic and deterministic learning systems, focusing on finite-time system identification and online learning under uncertainty.
        - Developed algorithms for data-regularized concurrent learning and adaptive control with formal convergence guarantees, validated on vehicle and robotic dynamics case studies.
        - Published several IEEE journal papers on learning-based control, system identification, and stability analysis of dynamic systems.

    - title: Postdoctoral Researcher
      institution: KIOS Center of Excellence, University of Cyprus, Nicosia
      year: Feb 2019 – Nov 2020
      description:
        - Designed finite-time distributed learning and estimation algorithms for nonlinear interconnected systems, with relevance to multi-subsystem powertrain and energy networks.
        - Collaborated with multi-disciplinary teams on cyber-physical system modeling, networked control, and robust estimation.

    - title: Assistant Professor, Control Systems
      institution: Semnan University, Semnan, Iran
      year: Sep 2016 – Feb 2019
      description:
        - Led research on distributed optimal and adaptive control of multi-agent networked systems using reinforcement learning and game theory.
        - Taught modern, nonlinear, and optimal control; supervised graduate research in control of complex dynamic systems.

